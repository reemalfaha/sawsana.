<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سوسنة: تدريب تيمس للصف الثامن</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237A1F2E'/%3E%3Cpath d='M32 10c4 8 4 14 0 20-4-6-4-12 0-20zM14 28c8 0 14 3 18 9-8 0-14-3-18-9zM50 28c-8 0-14 3-18 9 8 0 14-3 18-9zM32 54c-5-5-5-10 0-16 5 6 5 11 0 16z' fill='%23B8902A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--wine:#7A1F2E;--wine2:#5B1523;--gold:#B8902A;--bg:#FBF7F2;--card:#fff;--fg:#2A1B1E;--mute:#7B6A6D;--line:#E6DADC;--ok:#2F7D4F;--bad:#B3261E;--soft:#F3E4E7;--gsoft:#F6EDD3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 "Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
.top{background:#5A1422;color:#fff;padding:22px 16px 58px;border-bottom:4px solid var(--gold)}
.top .in,.main{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:48px;height:48px;flex:none}
h1,h2,h3{font-family:"El Messiri","Noto Naskh Arabic",serif;margin:0;line-height:1.35}
h1{font-size:1.9rem}.sub{margin:2px 0 0;opacity:.9;font-size:.95rem}
.school{margin-top:8px;font-size:.9rem;background:rgba(255,255,255,.14);display:inline-block;padding:0 12px;border-radius:20px}
.main{padding:0 16px 96px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{margin-top:-38px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(90,20,34,.10);position:relative}
.ring{position:relative;width:64px;height:64px;flex:none}.ring svg{width:64px;height:64px}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 .95rem "El Messiri";color:var(--wine)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.chips span{font-size:.82rem;border:1px solid var(--line);border-radius:20px;padding:0 12px}
.cnt{font-size:.78rem;background:var(--soft);color:var(--wine);border-radius:8px;padding:0 10px}
.split{display:flex;justify-content:space-between;align-items:center}
.l{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--wine);align-items:center;justify-content:center;font:700 .95rem "El Messiri";margin-left:12px;vertical-align:middle}
.opt.right .l{background:var(--ok);color:#fff}.opt.wrong .l{background:var(--bad);color:#fff}
.tabs{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--mute);min-width:90px;cursor:pointer}.tabs a.on{color:var(--wine);font-weight:600}.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--wine);color:#fff;text-align:center;text-decoration:none;display:inline-block}
button.alt{background:var(--soft);color:var(--wine)}button.gold{background:var(--gold)}.card>button.gold{margin-top:12px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:.78rem;background:var(--soft);color:var(--wine);border-radius:6px;padding:0 8px}
.opt{display:block;width:100%;text-align:right;background:#fff;color:var(--fg);border:2px solid var(--line);margin:8px 0;border-radius:14px}
.opt.sel{border-color:var(--wine);background:var(--soft)}
.opt.right{border-color:var(--ok);background:#E7F4EC}.opt.wrong{border-color:var(--bad);background:#FBE9E7}
.exp{background:#FFF8E6;border:1px solid #E8D49A;border-right:4px solid var(--gold);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--wine)}
.dom{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;margin:6px 0}
.timer{font-family:"El Messiri";font-size:1.2rem;color:var(--wine);font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:.9rem}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:0 16px 26px}
nav.crumb{font-size:.9rem}nav.crumb a{color:var(--wine);cursor:pointer}
</style></head><body>
<header class="top"><div class="in"><div class="brand">
<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#7A1F2E"/><path d="M32 9c5 9 5 16 0 23-5-7-5-14 0-23z" fill="#B8902A"/><path d="M11 27c9 0 16 4 20 11-9 0-16-4-20-11z" fill="#D9B24E"/><path d="M53 27c-9 0-16 4-20 11 9 0 16-4 20-11z" fill="#D9B24E"/><path d="M32 57c-6-5-6-11 0-18 6 7 6 13 0 18z" fill="#B8902A"/></svg>
<div><h1>سوسنة</h1><p class="sub">تدريب يُزهر · تيمس للصف الثامن</p></div></div>
<div class="school" id="school" hidden></div></div></header>
<main class="main" id="app"></main>
<nav class="tabs"><a data-t="h" class="on" onclick="home()"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>الرئيسية</a><a data-t="r" onclick="report()"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>تقريري</a></nav>
<footer style="padding-bottom:84px">تدريب مجاني. نتائجك محفوظة على جهازك فقط. أسئلة التدريب أصلية وليست من الاختبار الرسمي.<br>تصميمُ المنصّة وتنفيذُها: نوال بني عطية</footer>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id), app=$("app");
const SUB={math:"الرياضيات",sci:"العلوم"};
const KEY="sawsana.v1";
let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
db.h=db.h||{};          /* h[idx] = {ok:true/false} */
const sch=new URLSearchParams(location.search).get("school");
if(sch){const s=$("school");s.textContent=sch;s.hidden=false}
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==="class")e.className=a[x];else if(x.startsWith("on"))e.addEventListener(x.slice(2),a[x]);else e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?"":c)));return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=window.SW_Q.map((q,i)=>({...q,i}));
let timer=null;
function clear(){document.querySelector(".top").style.paddingBottom="22px";if(timer){clearInterval(timer);timer=null}app.replaceChildren()}
/* ---------- الرئيسية ---------- */
function home(){clear();setTab("h");document.querySelector(".top").style.paddingBottom="58px";
 const done=Object.keys(db.h).length,ok=Object.values(db.h).filter(x=>x.ok).length,tot=Q.length;
 const C=2*Math.PI*27,off=C*(1-Math.min(done/tot,1));
 const ring=el("div",{class:"ring"});ring.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#F3E4E7" stroke-width="8"/><circle cx="32" cy="32" r="27" fill="none" stroke="#7A1F2E" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 32 32)"/></svg><b>'+done+'/'+tot+'</b>';
 app.append(el("div",{class:"card hero"},ring,el("div",{},el("h2",{style:"font-size:1.15rem"},"أهلًا بكِ"),el("p",{class:"muted",style:"margin:0;line-height:1.6"},done?("أجبتِ "+done+" سؤالًا، الصحيح منها "+ok+"."):"ابدئي بالاختبار التشخيصي لنعرف أين تحتاجين تدريبًا أكثر."))));
 Object.keys(SUB).forEach(s=>{const n=Q.filter(q=>q.s===s).length;
  app.append(el("div",{class:"card"},el("div",{class:"split"},el("h3",{style:"color:var(--wine);font-size:1.3rem"},SUB[s]),el("span",{class:"cnt"},n+" سؤالًا")),
   el("div",{class:"chips"},window.SW_DOMAINS[s].map(d=>el("span",{},d))),
   el("div",{class:"row"},el("button",{style:"flex:1",onclick:()=>diag(s)},"تشخيصي"),el("button",{class:"alt",style:"flex:1",onclick:()=>topics(s)},"تدريب"),el("button",{class:"alt",style:"flex:1",onclick:()=>mock(s)},"بوقت"))))});
 app.append(el("button",{class:"alt",onclick:()=>{if(confirm("مسح كل نتائجك من هذا الجهاز؟")){db.h={};save();home()}}},"مسح نتائجي"))}
function setTab(t){document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===t))}
const crumb=(...p)=>el("nav",{class:"crumb"},el("a",{onclick:home},"الرئيسية"),...p.map(x=>[" › ",x]));
/* ---------- تدريب حسب الموضوع ---------- */
function topics(s){clear();app.append(crumb(SUB[s]));
 window.SW_DOMAINS[s].forEach(d=>{const qs=Q.filter(q=>q.s===s&&q.d===d);const got=qs.filter(q=>db.h[q.i]).length;
  app.append(el("div",{class:"card"},el("h3",{},d),el("p",{class:"muted"},got+" من "+qs.length+" أسئلة جرّبتِها"),el("button",{onclick:()=>run(shuffle(qs),SUB[s]+" · "+d,{feedback:true})},"ابدئي التدريب")))})}
/* ---------- تشخيصي ---------- */
function diag(s){const ds=window.SW_DOMAINS[s];let pick=[];ds.forEach(d=>pick.push(...shuffle(Q.filter(q=>q.s===s&&q.d===d)).slice(0,2)));
 run(shuffle(pick),"تشخيصي · "+SUB[s],{feedback:false,diag:true})}
/* ---------- اختبار بوقت ---------- */
function mock(s){const pick=shuffle(Q.filter(q=>q.s===s)).slice(0,12);run(pick,"اختبار بوقت · "+SUB[s],{feedback:false,minutes:18})}
/* ---------- تشغيل مجموعة أسئلة ---------- */
function run(list,title,o){clear();let n=0;const ans=[];
 const head=el("div",{class:"card"},el("div",{class:"row"},el("h3",{},title),o.minutes?el("span",{class:"timer",id:"tm"}):""),el("div",{class:"bar"},el("i",{id:"pb",style:"width:0"})));
 const box=el("div");app.append(crumb(title),head,box);
 if(o.minutes){let left=o.minutes*60;const tm=$("tm");const tick=()=>{tm.textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left--<=0){clearInterval(timer);finish()}};tick();timer=setInterval(tick,1000)}
 function show(){box.replaceChildren();$("pb").style.width=(n/list.length*100)+"%";
  const q=list[n];const order=shuffle([0,1,2,3]);let chosen=null;
  const c=el("div",{class:"card"},el("div",{class:"row"},el("span",{class:"tag"},q.d),el("span",{class:"tag"},q.c),el("span",{class:"muted"},(n+1)+" / "+list.length)),el("p",{},q.q));
  const LT=["أ","ب","ج","د"];const btns=order.map((k,j)=>{const b=el("button",{class:"opt",onclick:()=>pick(k)},el("span",{class:"l"},LT[j]),q.o[k]);b._k=k;return b});c.append(...btns);
  const next=el("button",{class:"gold",hidden:true,onclick:()=>{n++;n<list.length?show():finish()}},n+1<list.length?"التالي":"إنهاء");
  const fb=el("div");c.append(fb,next);box.append(c);
  function pick(k){if(chosen!==null&&o.feedback)return;chosen=k;ans[n]={q,k};
   btns.forEach(b=>{b.classList.toggle("sel",b._k===k)});
   if(o.feedback){btns.forEach(b=>{if(b._k===q.a)b.classList.add("right");else if(b._k===k)b.classList.add("wrong")});
    fb.replaceChildren(el("div",{class:"exp"},(k===q.a?"✔ إجابة صحيحة. ":"✘ الإجابة الصحيحة: "+q.o[q.a]+". "),q.why,el("br"),el("span",{class:"muted"},"خطأ شائع: "+q.mk)));}
   next.hidden=false}}
 function finish(){if(timer){clearInterval(timer);timer=null}
  ans.forEach(x=>{if(x)db.h[x.q.i]={ok:x.k===x.q.a}});save();
  const right=ans.filter(x=>x&&x.k===x.q.a).length;
  clear();app.append(crumb(title),el("div",{class:"card"},el("h2",{},"النتيجة: "+right+" من "+list.length),el("div",{class:"bar"},el("i",{style:"width:"+(right/list.length*100)+"%"}))));
  const rev=el("div",{class:"card"},el("h3",{},"مراجعة الأسئلة"));
  list.forEach((q,i)=>{const a=ans[i];const ok=a&&a.k===q.a;rev.append(el("div",{class:"exp",style:"margin:8px 0"},el("b",{},(ok?"✔ ":"✘ ")+q.q),el("br"),"الصحيح: "+q.o[q.a]+". ",q.why))});
  app.append(rev,el("div",{class:"row"},el("button",{class:"gold",onclick:report},"تقريري"),el("button",{class:"alt",onclick:home},"الرئيسية")))}
 show()}
/* ---------- التقرير ---------- */
function report(){clear();setTab("r");app.append(crumb("تقريري"));
 const any=Object.keys(db.h).length;if(!any){app.append(el("div",{class:"card"},"لم تجرّبي أسئلة بعد. ابدئي باختبار تشخيصي."));return}
 const weak=[];
 Object.keys(SUB).forEach(s=>{const c=el("div",{class:"card"},el("h3",{},SUB[s]));
  window.SW_DOMAINS[s].forEach(d=>{const qs=Q.filter(q=>q.s===s&&q.d===d&&db.h[q.i]);const p=qs.length?Math.round(qs.filter(q=>db.h[q.i].ok).length/qs.length*100):null;
   c.append(el("div",{class:"dom"},el("span",{},d),el("div",{class:"bar"},el("i",{style:"width:"+(p||0)+"%"})),el("span",{class:"muted"},p==null?"—":p+"%")));
   if(p!=null&&qs.length>=2)weak.push({s,d,p})});
  const lv=["معرفة","تطبيق","استدلال"].map(l=>{const qs=Q.filter(q=>q.s===s&&q.c===l&&db.h[q.i]);return qs.length?l+" "+Math.round(qs.filter(q=>db.h[q.i].ok).length/qs.length*100)+"%":null}).filter(Boolean);
  if(lv.length)c.append(el("p",{class:"muted"},"المستوى المعرفي: "+lv.join(" · ")));app.append(c)});
 weak.sort((a,b)=>a.p-b.p);
 const w=weak.filter(x=>x.p<70).slice(0,2);
 app.append(el("div",{class:"card"},el("h3",{},"خطة الدراسة"),w.length?w.map(x=>el("p",{},"ركّزي على «"+x.d+"» ("+SUB[x.s]+"): ابدئي بالتدريب حسب الموضوع، وراجعي الأخطاء الشائعة بعد كل سؤال، ثم أعيدي الاختبار بعد أسبوع."))
  :el("p",{},"أداؤك جيد في المجالات التي جرّبتِها. جرّبي الاختبار بوقت للتأكد.")),
  el("button",{class:"alt",onclick:home},"الرئيسية"))}
home();
</script></body></html>
