<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سوسنة: روابط ورموز المدارس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--wine:#7A1F2E;--gold:#B8902A;--bg:#FBF7F2;--fg:#2A1B1E;--mute:#7B6A6D;--line:#E6DADC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 "Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
.top{background:#5A1422;color:#fff;padding:20px 16px;border-bottom:4px solid var(--gold)}.in,.main{max-width:820px;margin:0 auto}
h1{font:700 1.6rem "El Messiri",serif;margin:0}.main{padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-weight:600;margin:6px 0 2px}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px}textarea{min-height:130px}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--wine);color:#fff;cursor:pointer;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.s{background:#fff;border:2px solid var(--wine);border-radius:16px;padding:14px;text-align:center;break-inside:avoid}
.s h3{font:700 1.05rem "El Messiri",serif;color:var(--wine);margin:0 0 6px}.s svg{width:100%;max-width:190px;height:auto}
.s small{display:block;color:var(--mute);font-size:.75rem;direction:ltr;word-break:break-all}.s p{margin:4px 0 0;font-size:.8rem}
.muted{color:var(--mute);font-size:.9rem}
@media print{.top,.card.ctl,button{display:none}body{background:#fff}.main{padding:0}}
</style></head><body>
<header class="top"><div class="in"><h1>سوسنة · روابط ورموز QR للمدارس</h1></div></header>
<main class="main">
<div class="card ctl">
<label for="base">رابط المنصة</label><input id="base" dir="ltr" placeholder="https://sawsana.example.workers.dev/">
<label for="names">أسماء المدارس (اسم في كل سطر)</label><textarea id="names" placeholder="مدرسة القطرانة الثانوية للبنات&#10;مدرسة ... الأساسية"></textarea>
<button id="go">إنشاء الرموز</button><button id="pr" style="background:var(--gold)">طباعة</button>
<p class="muted">الرمز يفتح المنصة ويعرض اسم المدرسة في أعلى الصفحة. اطبعي الصفحة من المتصفح (طباعة ← حفظ PDF) وأرسلي لكل مدرسة بطاقتها.</p></div>
<div class="grid" id="out"></div>
</main>
<script src="qrcode.js"></script>
<script>
const base=document.getElementById("base");try{base.value=location.origin+location.pathname.replace(/schools\.html$/,"")}catch(e){}
document.getElementById("pr").onclick=()=>window.print();
document.getElementById("go").onclick=()=>{
 const out=document.getElementById("out");out.replaceChildren();
 const b=base.value.trim().replace(/\?.*$/,"");
 document.getElementById("names").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(n=>{
  const url=b+(b.includes("?")?"":"?")+"school="+encodeURIComponent(n);
  const q=qrcode(0,"M");q.addData(url);q.make();
  const d=document.createElement("div");d.className="s";
  const h=document.createElement("h3");h.textContent=n;
  const svg=document.createElement("div");svg.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});
  const u=document.createElement("small");u.textContent=url;
  const p=document.createElement("p");p.textContent="امسحي الرمز وابدئي التدريب";
  const c=document.createElement("p");c.className="muted";c.textContent="تصميمُ المنصّة وتنفيذُها: نوال بني عطية";
  d.append(h,svg,p,u,c);out.append(d)})};
</script></body></html>
